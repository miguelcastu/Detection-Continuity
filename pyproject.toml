[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "detection-continuity"
version = "1.0.0"
description = "Offline detection regression gates and fault benchmarks for security telemetry"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
detcontinuity = "detcontinuity.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["detcontinuity"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
